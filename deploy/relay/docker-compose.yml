services:
  relay:
    build:
      context: ../../src/SRXDesk.Relay
      dockerfile: Dockerfile
    image: srxdesk-relay:latest
    container_name: srxdesk-relay
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5100
      - ASPNETCORE_ENVIRONMENT=Production
      # Admin token — YALNIZ Sulxay-ın admin aləti əmr verə bilsin deyə.
      # Eyni dəyəri admin Server appsettings.json-da da yazın. Boş buraxsanız
      # (dev) yoxlama söndürülür. Produksiyada mütləq güclü açar qoyun.
      - Admin__Secret=${MILLA_ADMIN_SECRET:-}
