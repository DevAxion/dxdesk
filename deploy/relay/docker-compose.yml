services:
  relay:
    build:
      context: ../../src/MillaRemote.Relay
      dockerfile: Dockerfile
    image: millaremote-relay:latest
    container_name: millaremote-relay
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5100
      - ASPNETCORE_ENVIRONMENT=Production
