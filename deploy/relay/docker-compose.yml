services:
  relay:
    build:
      context: ../../src/DXDesk.Relay
      dockerfile: Dockerfile
    image: dxdesk-relay:latest
    container_name: dxdesk-relay
    restart: unless-stopped
    # TƏHLÜKƏSİZLİK: konteyner root deyil (Dockerfile: USER app), əlavə Linux
    # imtiyazları yoxdur və proses yeni imtiyaz qazana bilməz.
    # Volume qovluqları uid 1654-ə aid olmalıdır:  sudo chown -R 1654:1654 audit certs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "5100:5100"
    environment:
      # HTTP (standart) və ya HTTPS: make-cert.sh-in verdiyi sətirləri .env-ə yazın.
      # "Urls" appsettings.json-dakı dəyəri əvəz edir (ASPNETCORE_URLS etmir).
      - Urls=${RELAY_URLS:-http://0.0.0.0:5100}
      - Kestrel__Certificates__Default__Path=${RELAY_CERT_PATH:-}
      - Kestrel__Certificates__Default__Password=${RELAY_CERT_PASSWORD:-}
      - ASPNETCORE_ENVIRONMENT=Production
      # Admin token — YALNIZ Sulxay-ın admin aləti əmr verə bilsin deyə.
      # Eyni dəyəri admin Server appsettings.json-da da yazın. Boş buraxsanız
      # (dev) yoxlama söndürülür. Produksiyada mütləq güclü açar qoyun.
      - Admin__Secret=${MILLA_ADMIN_SECRET:-}
      # Kompüterlərin qeydiyyat açarı (Service appsettings.json -> Relay:ClientSecret ilə eyni).
      - Client__Secret=${MILLA_CLIENT_SECRET:-}
      - Audit__Path=/app/audit/audit.log
    volumes:
      # Audit jurnalı konteyner yenilənəndə itməsin.
      - ./audit:/app/audit
      # TLS sertifikatı (make-cert.sh yaradır), yalnız oxumaq üçün.
      - ./certs:/app/certs:ro
